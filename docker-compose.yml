version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: callsvc_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-app}" ]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: callsvc_redis

  api:
    build: .
    container_name: callsvc_api
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      PYTHONUNBUFFERED: "1"
    volumes:
      - media:/data/media
    ports:
      - "8000:8000"
    # ВАЖНО: exec-форма, никакого "sh -c"
    command:
      - python
      - -m
      - uvicorn
      - app.main:app
      - --host=0.0.0.0
      - --port=8000
      - --log-level=debug
      - --access-log
      - --proxy-headers
      - --forwarded-allow-ips=*

  worker:
    build: .
    container_name: callsvc_worker
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      PYTHONUNBUFFERED: "1"
    volumes:
      - media:/data/media
    command:
      - celery
      - -A
      - app.tasks.celery_app
      - worker
      - -l
      - info

volumes:
  pgdata:
  media:
